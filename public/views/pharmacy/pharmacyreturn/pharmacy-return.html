<!--
  Migrated to React: PharmacyReturnScreen
  Comprehensive Hospital Pharmacy Return & Medicine Refund POS screen.
  Modern MediFlow design system with real-time calculations, barcode quick-search,
  line items return grid, settlement modes, and print integrations preserving 100% of enterprise business logic.
-->
<style>
  /* Suppress obstructive legacy copyright footer in pharmacy workstation to give full height to return POS */
  footer.ng-scope, .footer-content {
    display: none !important;
  }
  .content-wrapper {
    padding: 0 8px 16px 8px !important;
  }
</style>
<div class="hims-theme-billing" style="width: 100%; min-height: 100vh;">
    <react-component 
        name="PharmacyReturnScreen" 
        props="{ reactProps: reactProps, onAction: handleReactAction }">
    </react-component>
</div>

<!-- Preserved legacy print controls and hidden bridges for printing system compatibility -->
<div style="display: none;" aria-hidden="true">
    <button type="button" id="legacyDmPrintBtn" ng-click="dmPrint()"></button>
    <button type="button" id="legacyPrintRefBtn" ng-click="printref()"></button>
    <button type="button" id="legacySaleReturnPrintBtn" ng-click="saleandreturnprint()"></button>
    <printcontrol ng-if="!HidePrintBtn" printclick="print()" originalprintclick="originalprint()"
        hotkey="{'alt+p': print}" reason="currentcontext.printreason" entity="'OPbilling'" withheader="item.WithHeader" withoutheader="item.WithoutHeader">
    </printcontrol>
</div>
